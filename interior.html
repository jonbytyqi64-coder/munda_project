<!DOCTYPE html>
<html lang="en">
<head>

  <title>MUNDA · Audi Interior Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="interior.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <svg class="app__rings" viewBox="0 0 220 60" aria-hidden="true">
        <circle cx="30" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="6" />
        <circle cx="76" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="6" />
        <circle cx="122" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="6" />
        <circle cx="168" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="6" />
      </svg>
      <h1 class="app__title">Audi Interior Experience</h1>
      <p class="app__subtitle">Step inside the cockpit — start the engine, set the mood, or generate a photorealistic render.</p>
      <a class="cta-game" href="game.html" target="_blank" rel="noopener">
        <span class="cta-game__icon" aria-hidden="true">▶</span> Play MUNDA Lightweave
      </a>
    </header>

    <section class="interior off" id="interior" aria-label="Interactive Audi cockpit">
      <div class="interior__controls">
        <div class="ctl__group" role="group" aria-label="View mode">
          <span class="ctl__label">View</span>
          <button class="view-btn is-active" type="button" data-view="svg">Cockpit</button>
          <button class="view-btn" type="button" data-view="photo">Photoreal</button>
        </div>

        <button class="ctl ctl--primary" id="btn-power" type="button">
          <span class="ctl__icon" aria-hidden="true">⏻</span> <span id="power-label">Start engine</span>
        </button>

        <div class="ctl__group" role="group" aria-label="Ambient lighting colour">
          <span class="ctl__label">Ambient</span>
          <button class="swatch is-active" type="button" data-ambient="#f2f4f8" style="--c:#f2f4f8" aria-label="White ambient light" title="White"></button>
          <button class="swatch" type="button" data-ambient="#ff3b4e" style="--c:#ff3b4e" aria-label="Red ambient light" title="Red"></button>
          <button class="swatch" type="button" data-ambient="#2f6bff" style="--c:#2f6bff" aria-label="Blue ambient light" title="Blue"></button>
          <button class="swatch" type="button" data-ambient="#31d158" style="--c:#31d158" aria-label="Green ambient light" title="Green"></button>
          <button class="swatch" type="button" data-ambient="#9b5cff" style="--c:#9b5cff" aria-label="Purple ambient light" title="Purple"></button>
          <button class="swatch" type="button" data-ambient="#ff8a1e" style="--c:#ff8a1e" aria-label="Orange ambient light" title="Orange"></button>
        </div>

        <div class="ctl__group" role="group" aria-label="Speed" data-needs-engine>
          <label class="ctl__label" for="speed-slider">Speed <output id="speed-value" for="speed-slider">0</output> km/h</label>
          <input type="range" id="speed-slider" min="0" max="240" step="1" value="0" disabled />
        </div>

        <button class="ctl" id="btn-lights" type="button" data-needs-engine disabled>Headlights</button>
        <button class="ctl" id="btn-rev" type="button" data-needs-engine disabled>Rev engine</button>
      </div>

      <div class="interior__stage">
        <div class="view view--svg active" id="view-svg">
        <svg class="cockpit" id="cockpit" viewBox="0 0 1200 675" role="img" aria-label="Illustrated Audi interior">

            <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">

              <stop offset="0.5" stop-color="#101318" />
              <stop offset="1" stop-color="#0b0d11" />

            <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">

              <stop offset="1" stop-color="#6e8bff" stop-opacity="0" />

            <line x1="209.6" y1="615.9" x2="390.4" y2="615.9" stroke="#2e3440" stroke-width="2" opacity="0.5" />
            <line x1="300" y1="540" x2="206" y2="540" stroke="#171b22" stroke-width="20" stroke-linecap="round" />
            <line x1="300" y1="540" x2="394" y2="540" stroke="#171b22" stroke-width="20" stroke-linecap="round" />
            <line x1="300" y1="540" x2="300" y2="602" stroke="#171b22" stroke-width="20" stroke-linecap="round" />
            <circle cx="300" cy="540" r="36" fill="#0c0e12" stroke="#2a3038" stroke-width="1.5" />
            <g fill="none" stroke="#d8dde6" stroke-width="2.6">
              <circle cx="273.6" cy="540" r="9.4" />
              <circle cx="291.2" cy="540" r="9.4" />
              <circle cx="308.8" cy="540" r="9.4" />
              <circle cx="326.4" cy="540" r="9.4" />
            </g>
          </g>
        </svg>
        </div>

        <div class="view view--photo" id="view-photo">
          <img class="photo__img" id="photo-img" alt="AI-generated photorealistic Audi interior" />
          <div class="photo__bar">
            <span class="photo__status" id="photo-status" role="status">Photoreal render not generated yet.</span>
            <button class="ctl" id="btn-photo-gen" type="button">Generate render</button>
            <button class="ctl" id="btn-photo-save" type="button" hidden>Save PNG</button>
          </div>
        </div>
      </div>
    </section>

    <section class="app__chat">
      <h2 class="app__chat-title">Ask the AI</h2>
      <div class="chat__output" id="output" aria-live="polite">
        <!-- AI answers render here -->
      </div>

      <form class="chat__form" id="chat-form">
        <textarea
          class="chat__input"
          id="question"
          name="question"
          rows="1"
          placeholder="Type your question…"
          aria-label="Your question"
        ></textarea>
        <button class="chat__submit" type="submit" id="submit" aria-label="Send question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 12h14m0 0-5.5-5.5M18.5 12 13 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script src="interior.js"></script>
</body>
</html>
